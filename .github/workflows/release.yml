name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use_cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package assets (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          BIN_NAME="chnroutes-rs-next"
          ARCHIVE_NAME="${BIN_NAME}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" ./
          tar -czf "${ARCHIVE_NAME}" "${BIN_NAME}"
          echo "ASSET_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV
        shell: bash

      - name: Package assets (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $BIN_NAME = "chnroutes-rs-next.exe"
          $ARCHIVE_NAME = "chnroutes-rs-next-${{ matrix.target }}.zip"
          Copy-Item "target\${{ matrix.target }}\release\${$BIN_NAME}" -Destination ".\"
          Compress-Archive -Path $BIN_NAME -DestinationPath $ARCHIVE_NAME
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_PATH=${ARCHIVE_NAME}"
        shell: powershell

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}