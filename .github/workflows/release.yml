name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: chnroutes-rs-next-x86_64-unknown-linux-gnu.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: chnroutes-rs-next-x86_64-pc-windows-msvc.zip

          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: chnroutes-rs-next-aarch64-apple-darwin.tar.gz


    steps:
      - name: Checkout
        uses: actions/checkout@v6


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}


      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --features bin


      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.asset_name }} \
          -C target/${{ matrix.target }}/release chnroutes


      - name: Package Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive `
          -Path target/${{ matrix.target }}/release/chnroutes.exe `
          -DestinationPath ${{ matrix.asset_name }}


      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}