[package]
authors     = ["aabbc143"]
categories  = ["network-programming"]
description = "Rust version of chnroutes, with multiple CN IP data sources."
edition     = "2021"
homepage    = "https://github.com/aabbc143/chnroutes-rs-next"
keywords    = ["chnroutes", "VPN", "bypass", "route"]
license     = "MIT"
name        = "chnroutes-rs-next"
readme      = "./README.md"
repository  = "https://github.com/aabbc143/chnroutes-rs-next"
version     = "0.2.5"

[dependencies]
clap              = { version = "4.5.23", features = ["derive"], optional = true }
colored           = { version = "2.1.0", optional = true }
csv               = "1.3.1"
futures-util      = "0.3.31"
ipnet             = "2.9.0"
log               = "0.4.22"
net-route         = "0.4.5"
netdev            = "0.31.0"
once-fn            = "0.2.0"
pretty_env_logger = { version = "0.5.0", optional = true }
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
thiserror         = "2.0.7"
tokio             = { version = "1.42.0", features = ["rt", "macros", "rt-multi-thread"] }
zstd              = "0.13.2"

[dependencies.reqwest]
default-features = false
features         = ["blocking", "rustls-tls"]
version          = "0.12.9"

[profile.release]
lto       = true
opt-level = "z"
panic     = "abort"
strip     = true

[build-dependencies]
zstd = "0.13.2"

[features]
bin = ["clap", "colored", "pretty_env_logger"]

[lib]
name = "chnroutes"
path = "src/lib.rs"

[[bin]]
name              = "chnroutes-rs-next"
path              = "src/main.rs"
required-features = ["bin"]

[[example]]
name = "basic"
path = "examples/basic.rs"